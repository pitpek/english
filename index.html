<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1117" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="English" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/app.css" />
  <title>Английский — карточки</title>
</head>
<body>
  <div class="app">
    <header class="mobile-head">
      <div>
        <div class="brand">English <span>cards</span></div>
        <div class="meta" id="metaMobile">Словарь</div>
      </div>
      <div class="mobile-actions">
        <button class="ghost install-btn" id="installBtnMobile" type="button" title="На главный экран">📲</button>
        <button class="ghost filter-toggle" id="filterToggle" type="button">Фильтры</button>
      </div>
    </header>
    <div class="backdrop" id="backdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand">English <span>cards</span></div>
      <div class="meta" id="meta">Загрузка словаря…</div>
      <div class="group">
        <div class="group-head">
          <h3>Уровни</h3>
          <div class="mini-btns">
            <button class="mini" id="levelsAll" type="button">Все</button>
            <button class="mini" id="levelsNone" type="button">Снять</button>
          </div>
        </div>
        <div class="checks" id="levels"></div>
      </div>
      <div class="group">
        <div class="group-head">
          <h3>Разделы</h3>
          <div class="mini-btns">
            <button class="mini" id="catsAll" type="button">Все</button>
            <button class="mini" id="catsNone" type="button">Снять</button>
          </div>
        </div>
        <div class="checks" id="cats"></div>
      </div>
      <div class="group">
        <h3>Фильтр</h3>
        <div class="checks">
          <label class="check"><input type="checkbox" id="onlyStar" /> Только избранные</label>
          <label class="check"><input type="checkbox" id="onlyHard" /> Только сложные</label>
          <label class="check"><input type="checkbox" id="onlyNew" /> Ещё не знаю</label>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="bar"><i id="bar"></i></div>
        <div class="meta" id="progressText" style="margin:8px 0 0">0 выучено</div>
      </div>
      <div class="row-btns">
        <button class="ghost" id="resetProgress" type="button">Сбросить прогресс</button>
        <label class="ghost file-btn">Загрузить JSON<input type="file" id="dictFile" accept=".json,.md,.txt,application/json" /></label>
        <button class="ghost install-btn" id="installBtn" type="button">На главный экран</button>
        <button class="primary filters-done" id="filtersDone" type="button">Готово</button>
      </div>
    </aside>
    <main class="main">
      <div class="top">
        <div class="modes">
          <button class="mode active" data-mode="cards" type="button">Карточки</button>
          <button class="mode" data-mode="learn" type="button">Заучивание</button>
          <button class="mode" data-mode="write" type="button">Письмо</button>
          <button class="mode" data-mode="match" type="button">Сопоставление</button>
          <button class="mode" data-mode="list" type="button">Список</button>
        </div>
        <div class="tools">
          <button class="chip active" id="dirBtn" type="button">EN → RU</button>
          <button class="ghost" id="shuffleBtn" type="button">Перемешать</button>
          <button class="icon-btn" id="speakBtn" type="button" title="Произнести">🔊</button>
        </div>
      </div>
      <div class="stage" id="stage"></div>
    </main>
    <div class="modal hidden" id="installModal">
      <div class="modal-card">
        <h3>На главный экран</h3>
        <div id="installText"></div>
        <button class="primary" id="installClose" type="button">Понятно</button>
      </div>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
